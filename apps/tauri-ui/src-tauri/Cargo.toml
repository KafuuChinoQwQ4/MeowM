[package]
name = "ledger-tauri-ui"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
name = "ledger_tauri_ui"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["clock"] }
uuid = "1"
ledger-domain = { path = "../../../crates/ledger-domain" }
ledger-app = { path = "../../../crates/ledger-app" }
ledger-storage = { path = "../../../crates/ledger-storage" }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
tempfile = "3"
