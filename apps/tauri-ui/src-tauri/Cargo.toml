[package]
name = "ledger-tauri-ui"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
name = "ledger_tauri_ui"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["clock"] }
uuid = "1"
ledger-domain = { path = "../../../crates/ledger-domain" }
ledger-app = { path = "../../../crates/ledger-app" }
ledger-storage = { path = "../../../crates/ledger-storage" }
ledger-import = { path = "../../../crates/ledger-import" }

ledger-notifications = { path = "../../../crates/ledger-notifications" }
serde_json = { version = "1", features = ["arbitrary_precision"] }
ureq = { version = "3.4.2", features = ["json", "socks-proxy"] }
base64 = "0.22"
zeroize = "1"
keyring-core = "1.0.1"
rsa = { version = "0.9.8", features = ["sha2"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
flate2 = "1"
url = "2"
ledger-backup = { path = "../../../crates/ledger-backup" }
ledger-export = { path = "../../../crates/ledger-export" }
tokio-socks = "0.5"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android-native-keyring-store = "1.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
tempfile = "3"
