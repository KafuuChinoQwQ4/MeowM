[package]
name = "ledger-slint-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
[lib]
crate-type = ["rlib", "cdylib"]
[dependencies]
ledger-backup = { path = "../../crates/ledger-backup" }
zeroize = "1"
uuid = { version = "1", features = ["v5"] }
ledger-import = { path = "../../crates/ledger-import" }
ledger-app = { path = "../../crates/ledger-app" }
ledger-domain = { path = "../../crates/ledger-domain" }
ledger-storage = { path = "../../crates/ledger-storage" }
chrono = { version = "0.4", features = ["clock"] }
slint = { version = "=1.13.1", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"
tempfile = "3"
slint = { version = "=1.13.1", default-features = false, features = ["backend-winit"] }
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.13.1", default-features = false, features = ["backend-android-activity-06"] }
jni = "0.21"
[build-dependencies]
slint-build = "=1.13.1"
